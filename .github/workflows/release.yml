name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Protected release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:docs
      - run: npm run example:setup
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_OUTPUT_DIRECTORY: .artifacts/example
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:licenses
      - name: Verify coordinated version and publish with provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-report
          path: .artifacts/release-report.json
