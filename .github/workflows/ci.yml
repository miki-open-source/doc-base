name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:docs
      - run: npm run test:dev
      - run: npm run example:setup
      - run: npm run example:validate
      - run: npm run example:build
      - run: npm run docs:validate
      - run: npm run docs:build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:licenses
  packages:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TEST_OUTPUT_DIRECTORY: .artifacts/example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run example:setup
      - run: npm run test:package
      - run: npm install --prefix .artifacts/managers --ignore-scripts pnpm@12.11.2 @yarnpkg/cli-dist@4.18.1
      - run: npm run test:managers
        env:
          TEST_PNPM_CLI: ${{ github.workspace }}/.artifacts/managers/node_modules/pnpm/bin/pnpm.mjs
          TEST_YARN_CLI: ${{ github.workspace }}/.artifacts/managers/node_modules/@yarnpkg/cli-dist/bin/yarn.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:dev
        env:
          TEST_DEV_BROWSER: "1"
