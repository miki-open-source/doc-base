name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run test:docs
      - run: pnpm run test:dev
      - run: pnpm run example:setup
      - run: pnpm run example:validate
      - run: pnpm run example:build
      - run: pnpm run docs:validate
      - run: pnpm run docs:build
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm run audit:licenses
  packages:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TEST_OUTPUT_DIRECTORY: .artifacts/example
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run example:setup
      - run: pnpm run test:package
      - run: pnpm run test:managers
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run test:dev
        env:
          TEST_DEV_BROWSER: "1"
