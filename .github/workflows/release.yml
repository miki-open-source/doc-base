name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Protected release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run test:docs
      - run: pnpm run example:setup
      - run: pnpm run test:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          TEST_OUTPUT_DIRECTORY: .artifacts/example
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm run audit:licenses
      - name: Verify coordinated version and publish with provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: pnpm run release

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-report
          path: .artifacts/release-report.json
